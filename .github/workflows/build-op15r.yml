name: OnePlus 15R kernel

# Rebuilds the exact GKI kernel the phone ships for a given firmware (Google kernel/common
# release tag) and adds SukiSU Ultra (built-in) + enhanced SUSFS + the GKID-Kernels feature set
# (Baseband Guard, NoMount, NTSync, DroidSpaces, NetHunter, BBRv3, networking configs).
# GKID's performance/battery tuning patches are intentionally NOT applied. To target a new
# firmware, read `uname -r` on the phone (the g<sha> part), find the matching
# android16-6.12-<YYYY-MM>_r<N> tag and pass it as common_ref / release_branch.
#
# Build pipeline adapted from Enginex0/Super-Builders (GPL-3.0); features from
# ahmed-alnassif/GKID-Kernels (GPL-3.0), maxsteeel/nomount, Baseband-guard.

on:
  workflow_dispatch:
    inputs:
      common_ref:
        description: "kernel/common ref to build (release tag of the phone's current kernel)"
        type: string
        default: "refs/tags/android16-6.12-2026-03_r54"
      release_branch:
        description: "Release branch that contains that tag (e.g. android16-6.12-2026-03)"
        type: string
        default: "android16-6.12-2026-03"
      expect_commit:
        description: "Abort unless kernel/common HEAD starts with this sha (the g<sha> from uname -r; empty = skip)"
        type: string
        default: "242e1a07f878"
      add_bbg:
        description: "Baseband Guard"
        type: boolean
        default: true
      add_nomount:
        description: "NoMount VFS path-redirection driver (self-contained fs/nomount; needs the NoMount metamodule in userspace)"
        type: boolean
        default: true
      nomount_ref:
        description: "NoMount git ref (tag or 40-char sha); default = v2.2.0"
        type: string
        default: "bf1847f98fed382369c43bfd652cd93774b9b8e3"
      gkid_ntsync:
        description: "NTSync (Winlator/GameHub); the driver is already in the r54 tree, this enables it"
        type: boolean
        default: true
      gkid_droidspaces:
        description: "DroidSpaces (SYSVIPC/IPC_NS/PID_NS/POSIX_MQUEUE with GKID's kABI padding patch)"
        type: boolean
        default: true
      gkid_nethunter:
        description: "NetHunter (mac80211 monitor/injection patch + rtw88 USB drivers; experimental, build separately)"
        type: boolean
        default: false
      gkid_bbrv3:
        description: "BBRv3 (GKID patch; r54 already carries part of the BBRv3 series, so it may be skipped and reported)"
        type: boolean
        default: false
      gkid_net:
        description: "GKID networking/filesystem configs (ip_set, IPv6 NAT, netfilter/tc extras, TTL, exFAT/VFAT ...)"
        type: boolean
        default: true
      gkid_net_defaults:
        description: "Make BBR the default congestion control and fq_codel the default qdisc (a tuning choice; off by default)"
        type: boolean
        default: false
      ksu_variant:
        description: "Root implementation: sukisu (SukiSU Ultra 'builtin', manager v4.3.x) or next (KernelSU-Next dev-susfs)"
        type: choice
        options:
          - sukisu
          - next
        default: sukisu
      ksu_commit:
        description: "Override the root implementation commit (40-char sha; empty = pin from root-pins.env)"
        type: string
        default: ""
      susfs_commit:
        description: "Override the SUSFS commit (empty = the pin paired with ksu_variant)"
        type: string
        default: ""
      add_ksu:
        description: "Root implementation built into the kernel (off = root only via external LKM)"
        type: boolean
        default: true
      add_susfs:
        description: "SUSFS kernel patches (needs add_ksu; off = isolation build)"
        type: boolean
        default: true
      ksu_disable_safemode:
        description: "Disable SukiSU's volume-key 'safe mode' (3 presses of either volume key before its boot check flags safe mode, blocks module install). Built-in KSU registers the key handler at kernel start, unlike an LKM."
        type: boolean
        default: true
      lsm_mode:
        description: "LSM slots: add_slot (count KSU/BBG in MAX_LSM_COUNT, keeps every LSM) or skip (SukiSU only: skip its LSM registration)"
        type: choice
        options:
          - add_slot
          - skip
        default: add_slot
      susfs_profile:
        description: "SUSFS option set: full (all options) or core (drops unicode filter, hardening, symbol hiding, cmdline spoof, open/kstat redirect)"
        type: choice
        options:
          - full
          - core
        default: full
      clean_baseline:
        description: "CONTROL BUILD: no SukiSU/SUSFS/NoMount/GKID extras/BBG at all (stock source rebuilt)"
        type: boolean
        default: false
      release_version:
        description: "Kernel release version, shown in uname, the AnyKernel3 banner and the artifact name"
        type: string
        default: "v1.0.0"
      infra_tweaks:
        description: "Apply CRC-check bypass, protected-export removal and ABI-check bypass"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: "${{ inputs.ksu_variant }} + SUSFS + GKID features"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANDROID_VER: android16
      KERNEL_VER: "6.12"
      VERSION_DIR: android16-6.12
      MANIFEST_BRANCH: common-${{ inputs.release_branch }}
      COMMON_BRANCH: ${{ inputs.release_branch }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
          /usr/share/swift /usr/local/share/boost /usr/local/julia* /usr/share/miniconda || true
        sudo apt-get remove -y -qq '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-cloud-cli \
          microsoft-edge-stable google-chrome-stable firefox powershell mysql-server-core-* postgresql-* >/dev/null 2>&1 || true
        sudo apt-get autoremove -y -qq >/dev/null 2>&1 || true
        df -h /

    - name: Install host tools
      run: sudo apt-get install -y -qq lld binutils jq pigz zip dos2unix

    - name: Fetch helpers (AnyKernel3 flasher, repo tool)
      run: |
        git clone --depth=1 -b gki-2.0 https://github.com/WildKernels/AnyKernel3.git "$GITHUB_WORKSPACE/AnyKernel3"
        rm -rf "$GITHUB_WORKSPACE/AnyKernel3/.git"
        mkdir -p "$GITHUB_WORKSPACE/git-repo"
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
        chmod +x "$GITHUB_WORKSPACE/git-repo/repo"
        echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

    - name: Setup environment
      run: |
        KERNEL_ROOT="$GITHUB_WORKSPACE/$ANDROID_VER-$KERNEL_VER"
        mkdir -p "$KERNEL_ROOT"
        {
          echo "KERNEL_ROOT=$KERNEL_ROOT"
          echo "DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig"
          echo "DEFCONFIG_FRAGMENT=$KERNEL_ROOT/common/arch/arm64/configs/sukisu_gki.fragment"
          echo "KERNEL_PATCHES=$GITHUB_WORKSPACE/$VERSION_DIR/gkid/patches"
          echo "ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3"
          echo "GKID_REPORT=$GITHUB_WORKSPACE/gkid-report.txt"
          echo "GKID_FRAGMENT=$GITHUB_WORKSPACE/gkid-conditional.fragment"
        } >> "$GITHUB_ENV"

    - name: Sync kernel source (pinned to the phone's exact commit)
      working-directory: ${{ env.KERNEL_ROOT }}
      env:
        COMMON_REF: ${{ inputs.common_ref }}
      run: |
        git config --global user.name  "build"
        git config --global user.email "build@localhost"
        repo init -u https://android.googlesource.com/kernel/manifest -b "$MANIFEST_BRANCH" --depth=1
        # Pin ONLY the kernel/common project (the superproject line must stay on the branch).
        sed -i "/path=\"common\" name=\"kernel\/common\"/s|revision=\"${COMMON_BRANCH}\"|revision=\"${COMMON_REF}\"|" .repo/manifests/default.xml
        grep 'path="common" name="kernel/common"' .repo/manifests/default.xml
        repo --trace sync -c -j"$(nproc --all)" --fail-fast --no-tags --force-sync --no-clone-bundle
        echo "common HEAD: $(git -C common rev-parse HEAD)"
        grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' common/Makefile

    - name: Verify the source matches the phone's kernel
      working-directory: ${{ env.KERNEL_ROOT }}
      env:
        EXPECT_COMMIT: ${{ inputs.expect_commit }}
      run: |
        SL=$(grep '^SUBLEVEL = ' common/Makefile | awk '{print $3}')
        HEAD=$(git -C common rev-parse HEAD)
        echo "Building Linux $KERNEL_VER.$SL from $HEAD"
        echo "SUBLEVEL=$SL" >> "$GITHUB_ENV"
        if [ "${{ inputs.clean_baseline }}" = "true" ]; then
          echo "ARTIFACT_BASE=OP15R-${KERNEL_VER}.${SL}-CLEAN-infra-${{ inputs.infra_tweaks }}" >> "$GITHUB_ENV"
        else
          case "${{ inputs.ksu_variant }}" in next) ROOT=KSUNext ;; *) ROOT=SukiSU ;; esac
          [ "${{ inputs.add_ksu }}" = "true" ] || ROOT=NoKSU
          echo "ROOT_LABEL=$ROOT" >> "$GITHUB_ENV"
          SUF=""
          [ "${{ inputs.add_susfs }}" = "true" ] && SUF="$SUF-SUSFS"
          [ "${{ inputs.susfs_profile }}" = "core" ] && SUF="${SUF}core"
          [ "${{ inputs.add_nomount }}" = "true" ] && SUF="$SUF-NoMount"
          [ "${{ inputs.add_bbg }}" = "true" ] && SUF="$SUF-BBG"
          [ "${{ inputs.gkid_ntsync }}" = "true" ] && SUF="$SUF-NTSync"
          [ "${{ inputs.gkid_droidspaces }}" = "true" ] && SUF="$SUF-Droid"
          [ "${{ inputs.gkid_nethunter }}" = "true" ] && SUF="$SUF-NetHunter"
          [ "${{ inputs.gkid_bbrv3 }}" = "true" ] && SUF="$SUF-BBRv3"
          [ "${{ inputs.lsm_mode }}" = "skip" ] && SUF="$SUF-lsmskip"
          REL="${{ inputs.release_version }}"
          echo "KERNEL_REL=$REL" >> "$GITHUB_ENV"
          echo "KERNEL_LABEL=Core $REL (${KERNEL_VER}.${SL}) - ${ROOT}${SUF}" >> "$GITHUB_ENV"
          echo "ARTIFACT_BASE=OP15R-Core-${REL}-${KERNEL_VER}.${SL}-${ROOT}${SUF}" >> "$GITHUB_ENV"
        fi
        if [ -n "$EXPECT_COMMIT" ]; then
          case "$HEAD" in
            "$EXPECT_COMMIT"*) echo "source commit matches $EXPECT_COMMIT" ;;
            *) echo "::error::expected commit $EXPECT_COMMIT, got $HEAD"; exit 1 ;;
          esac
        fi

    - name: Load source pins
      run: |
        set -a; . "$GITHUB_WORKSPACE/$VERSION_DIR/root-pins.env"; set +a
        for v in SUKISU_REPO SUKISU_PIN SUKISU_SUSFS_PIN NEXT_REPO NEXT_PIN NEXT_SUSFS_PIN NEXT_SUSFS_PICKS \
                 SUSFS_REPO SUSFS_BRANCH WK_REPO WK_PIN; do
          echo "$v=${!v}" >> "$GITHUB_ENV"
        done

    - name: Integrate root implementation (${{ inputs.ksu_variant }})
      if: ${{ !inputs.clean_baseline && inputs.add_ksu }}
      working-directory: ${{ env.KERNEL_ROOT }}
      env:
        KSU_OVERRIDE: ${{ inputs.ksu_commit }}
        VARIANT: ${{ inputs.ksu_variant }}
      run: |
        set -euo pipefail
        case "$VARIANT" in
          # NB: KERNEL_ROOT is this repo's android16-6.12/ folder, which already has SukiSU-Ultra/
          # (the ZeroMount patch) - so the clone dirs must not be named SukiSU-Ultra.
          sukisu) REPO="$SUKISU_REPO"; PIN="$SUKISU_PIN"; DIR=ksu-sukisu; UPSTREAM=main ;;
          next)   REPO="$NEXT_REPO";   PIN="$NEXT_PIN";   DIR=ksu-next;   UPSTREAM=dev ;;
          *) echo "::error::unknown ksu_variant $VARIANT"; exit 1 ;;
        esac
        PIN="${KSU_OVERRIDE:-$PIN}"
        [[ "$PIN" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::root commit must be a full 40-char sha"; exit 1; }
        [ ! -e common/drivers/kernelsu ] || { echo "::error::common/drivers/kernelsu already exists"; exit 1; }
        [ ! -e "$DIR" ] || { echo "::error::$KERNEL_ROOT/$DIR already exists"; exit 1; }
        echo "KSU_DIR=$DIR" >> "$GITHUB_ENV"
        # full history: KSU_VERSION is derived from the commit count
        for i in 1 2 3 4 5; do git clone --no-checkout "$REPO" "$DIR" && break; rm -rf "./$DIR"; sleep 8; done
        git -C "$DIR" fetch origin "$PIN"
        git -C "$DIR" checkout --detach "$PIN"
        [ "$(git -C "$DIR" rev-parse HEAD)" = "$PIN" ] || { echo "::error::root commit mismatch"; exit 1; }
        # Deterministic KSU_VERSION (WildKernels root-setup rule): 30000 + commits at the merge-base
        # with the upstream branch. Kbuild's own heuristic reads "HEAD" on a detached checkout.
        BASE="$(git -C "$DIR" merge-base HEAD "origin/$UPSTREAM" 2>/dev/null || echo "$PIN")"
        COUNT="$(git -C "$DIR" rev-list --count "$BASE")"
        TAG="$(git -C "$DIR" describe --tags --abbrev=0 "$BASE" 2>/dev/null || echo unknown)"
        # (SukiSU builtin has no Kbuild: its Makefile derives the version from the full history)
        if [ -f "$DIR/kernel/Kbuild" ] && grep -q 'BASE_BRANCH' "$DIR/kernel/Kbuild"; then
          printf '\n# CI: deterministic KSU_VERSION\nKSU_VERSION := %s\nKSU_VERSION_TAG := "%s"\n' \
            "$((30000 + COUNT))" "$TAG" >> "$DIR/kernel/Kbuild"
        fi
        echo "$DIR @ $(git -C "$DIR" log -1 --format='%h %cs %s') | KSU_VERSION=$((30000 + COUNT)) tag=$TAG"
        ln -s "$(realpath --relative-to=common/drivers "$PWD/$DIR/kernel")" common/drivers/kernelsu
        grep -q 'obj-$(CONFIG_KSU) += kernelsu/' common/drivers/Makefile ||
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
        grep -q 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig ||
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig
        # Next's Kbuild hard-errors at parse time while .config has neither KPROBES nor KSU_SUSFS
        if [ -f "$DIR/kernel/Kbuild" ]; then
          sed -i 's/$(error "KernelSU requires either CONFIG_KPROBES=y or CONFIG_KSU_SUSFS=y")/$(warning "KernelSU requires either CONFIG_KPROBES=y or CONFIG_KSU_SUSFS=y")/' "$DIR/kernel/Kbuild"
        fi
        # SukiSU builtin (1cfa5734) calls the SUSFS priority-uid-filter API, but its Kconfig predates
        # the symbol that guards the prototype in linux/susfs.h, so the calls fail as implicit
        # declarations. Define the symbol in the cloned tree (the SUSFS pin already implements it).
        if [ "$VARIANT" = "sukisu" ] && [ -f "$DIR/kernel/Kconfig" ]; then
          python3 - "$DIR/kernel/Kconfig" <<'PYEOF'
        import sys
        p = sys.argv[1]
        s = open(p, encoding='utf-8').read()
        if 'KSU_SUSFS_PRIORITY_UID_FILTER' in s:
            print('Kconfig already defines KSU_SUSFS_PRIORITY_UID_FILTER')
            raise SystemExit(0)
        block = """
        config KSU_SUSFS_PRIORITY_UID_FILTER
            bool "KernelSU addon - SUSFS priority uid filter"
            depends on KSU_SUSFS
            default y
        """
        idx = s.find('\nendmenu')
        if idx < 0:
            sys.exit('KernelSU Kconfig: endmenu anchor not found')
        open(p, 'w', encoding='utf-8').write(s[:idx] + block + s[idx:])
        print('added CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER to the SukiSU Kconfig')
        PYEOF
        fi
        ls -l common/drivers/kernelsu

    - name: Disable KSU volume-key safe mode
      if: ${{ !inputs.clean_baseline && inputs.add_ksu && inputs.ksu_disable_safemode }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        F="$KSU_DIR/kernel/runtime/ksud.c"
        if [ ! -f "$F" ]; then F="$(grep -rl 'safe_mode_flag = true;' "$KSU_DIR/kernel" | head -1 || true)"; fi
        [ -n "$F" ] && [ -f "$F" ] || { echo "::warning::no volume-key safe-mode code found in this root implementation (nothing to disable)"; exit 0; }
        [ "$(grep -c 'safe_mode_flag = true;' "$F")" = "1" ] || { echo "::error::expected exactly one 'safe_mode_flag = true;' in $F"; exit 1; }
        sed -i 's/safe_mode_flag = true;/(void)0; \/* volume-key safe mode disabled by build (ksu_disable_safemode) *\//' "$F"
        grep -n 'safe mode disabled by build' "$F"

    - name: LSM slots (MAX_LSM_COUNT) / SukiSU LSM registration
      if: ${{ !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        SLOTS=()
        if [ "${{ inputs.add_ksu }}" = "true" ] && grep -rqs 'security_add_hooks(ksu_hooks' "$KSU_DIR/kernel"; then
          if [ "${{ inputs.lsm_mode }}" = "skip" ]; then
            python3 - "$KSU_DIR/kernel/hook/lsm_hook.c" <<'PYEOF'
        import sys
        p = sys.argv[1]
        s = open(p, encoding='utf-8').read()
        old = 'security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");'
        if s.count(old) != 1:
            sys.exit('lsm_hook.c: expected security_add_hooks call not found exactly once')
        s = s.replace(old, '(void)ksu_hooks; pr_info("LSM registration skipped (lsm_mode=skip)\\n");', 1)
        open(p, 'w', encoding='utf-8').write(s)
        print('lsm_mode=skip: SukiSU LSM registration removed (mount-hide file_permission hook lost)')
        PYEOF
          else
            # Linux 6.12 takes const struct lsm_id *, not the LSM name string. The slot is still
            # needed (security_add_hooks consumes one), so patch the call site instead of skipping.
            python3 - "$KSU_DIR/kernel/hook/lsm_hook.c" <<'PYEOF'
        import sys
        p = sys.argv[1]
        s = open(p, encoding='utf-8').read()
        if 'ksu_lsmid' in s:
            print('SukiSU LSM registration already patched for 6.12')
            raise SystemExit(0)
        old = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)\n    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");\n#else\n'
        new = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)\n    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), &ksu_lsmid);\n#elif LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)\n    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");\n#else\n'
        if s.count(old) != 1:
            sys.exit('lsm_hook.c: 4.11+ security_add_hooks block not found exactly once')
        s = s.replace(old, new, 1)
        anchor = 'static struct security_hook_list ksu_hooks[] = {'
        if s.count(anchor) != 1:
            sys.exit('lsm_hook.c: ksu_hooks[] anchor not found exactly once')
        decl = '#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)\nstatic struct lsm_id ksu_lsmid = { .name = "ksu", .id = LSM_ID_UNDEF };\n#endif\n\n'
        s = s.replace(anchor, decl + anchor, 1)
        open(p, 'w', encoding='utf-8').write(s)
        print('patched SukiSU LSM registration for kernel 6.12 (struct lsm_id)')
        PYEOF
            SLOTS+=(KSU=CONFIG_KSU)
          fi
        else
          echo "root implementation does not call security_add_hooks(): no KSU slot needed"
        fi
        [ "${{ inputs.add_bbg }}" = "true" ] && SLOTS+=(BBG=CONFIG_BBG)
        if [ ${#SLOTS[@]} -eq 0 ]; then echo "no extra LSM slots"; exit 0; fi
        bash "$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/add-lsm-slots.sh" common "${SLOTS[@]}"

    - name: Fix old-kernel compatibility helpers
      if: ${{ !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        FIX_SCRIPT="$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/fix-old-kernel-compat.sh"
        [ -f "$FIX_SCRIPT" ] && bash "$FIX_SCRIPT" "$KERNEL_ROOT/common" "$SUBLEVEL" || true

    - name: Fetch SUSFS (paired with ${{ inputs.ksu_variant }}) + WildKernels SUSFS helpers
      if: ${{ !inputs.clean_baseline && inputs.add_susfs && inputs.add_ksu }}
      env:
        SUSFS_OVERRIDE: ${{ inputs.susfs_commit }}
      run: |
        set -euo pipefail
        case "${{ inputs.ksu_variant }}" in
          sukisu) PIN="$SUKISU_SUSFS_PIN"; PICKS="" ;;
          next)   PIN="$NEXT_SUSFS_PIN";   PICKS="$NEXT_SUSFS_PICKS" ;;
        esac
        PIN="${SUSFS_OVERRIDE:-$PIN}"
        S="$GITHUB_WORKSPACE/susfs4ksu"
        for i in 1 2 3 4 5; do git clone -b "$SUSFS_BRANCH" "$SUSFS_REPO" "$S" && break; rm -rf "$S"; sleep 8; done
        git -C "$S" checkout --detach "$PIN"
        if [ -n "$PICKS" ]; then
          git -C "$S" fetch https://gitlab.com/pershoot/susfs4ksu.git $PICKS
          for c in $PICKS; do git -C "$S" cherry-pick "$c"; done
        fi
        echo "SUSFS $(git -C "$S" log -1 --format='%h %cs %s') | $(grep -h 'define SUSFS_VERSION' "$S/kernel_patches/include/linux/susfs.h")"
        for i in 1 2 3 4 5; do git clone --no-checkout "$WK_REPO" "$GITHUB_WORKSPACE/wk" && break; rm -rf "$GITHUB_WORKSPACE/wk"; sleep 8; done
        git -C "$GITHUB_WORKSPACE/wk" checkout --detach "$WK_PIN"

    - name: Apply SUSFS kernel patch
      if: ${{ !inputs.clean_baseline && inputs.add_susfs && inputs.add_ksu }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        set -euo pipefail
        S="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"; WK="$GITHUB_WORKSPACE/wk/.github/scripts"
        P="50_add_susfs_in_gki-${ANDROID_VER}-${KERNEL_VER}.patch"
        cp "$S/fs/"* fs/
        cp "$S/include/linux/"* include/linux/
        cp "$S/$P" ./
        # same sequence as WildKernels .github/actions/susfs-patches for android16-6.12
        python3 "$WK/susfs_guard_priority_helpers.py" fs/susfs.c
        grep -q 'i_user_ns' include/linux/fs.h || python3 "$WK/susfs_idmap_compat.py" fs/susfs.c
        python3 "$WK/susfs_restore_context.py" "$P" "$PWD"
        python3 "$WK/apply_susfs_compat.py" "$PWD" "$P"
        python3 "$WK/susfs_fdinfo_fanotify_arity.py" "$PWD"
        if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
          sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
          echo "added VMA_PAD_START fallback"
        fi
        rm -f "$P"
        # apply_susfs_compat.py leaves .orig backups for hunks applied at an offset; real failures
        # leave .rej, which the reject check below still catches
        echo "offset backups: $(find . -name '*.orig' | wc -l)"; find . -name '*.orig' -delete

    - name: Add NoMount (fs/nomount, built-in)
      # NoMount is a self-contained driver (own inode/dir ops, no hooks in core VFS files), so it
      # needs neither SUSFS context nor patch hunks. The source is copied (not symlinked) into the
      # tree and pinned to a commit.
      if: ${{ inputs.add_nomount && !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      env:
        NOMOUNT_REF: ${{ inputs.nomount_ref }}
      run: |
        set -euo pipefail
        for i in 1 2 3 4 5; do git clone --no-checkout https://github.com/maxsteeel/nomount.git "$GITHUB_WORKSPACE/nomount" && break; rm -rf "$GITHUB_WORKSPACE/nomount"; sleep 8; done
        git -C "$GITHUB_WORKSPACE/nomount" fetch --tags origin
        git -C "$GITHUB_WORKSPACE/nomount" checkout --detach "$NOMOUNT_REF"
        echo "NoMount $(git -C "$GITHUB_WORKSPACE/nomount" log -1 --format='%h %cs %s')"
        [ ! -e fs/nomount ] || { echo "::error::fs/nomount already exists"; exit 1; }
        mkdir fs/nomount
        cp "$GITHUB_WORKSPACE"/nomount/kernel/src/* fs/nomount/
        grep -q 'nomount' fs/Makefile || printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> fs/Makefile
        grep -q 'fs/nomount/Kconfig' fs/Kconfig || python3 - fs/Kconfig <<'PYEOF'
        import sys
        p = sys.argv[1]
        s = open(p, encoding='utf-8').read()
        i = s.rfind('\nendmenu')
        if i < 0:
            sys.exit('fs/Kconfig: endmenu anchor not found')
        open(p, 'w', encoding='utf-8').write(s[:i] + '\nsource "fs/nomount/Kconfig"\n' + s[i:])
        print('fs/Kconfig: sourced fs/nomount/Kconfig')
        PYEOF
        ls -l fs/nomount

    - name: Fix SUSFS compatibility
      if: ${{ !inputs.clean_baseline && inputs.add_susfs && inputs.add_ksu }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        FIX="$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/fix-susfs-compat.sh"
        [ -f "$FIX" ] && bash "$FIX" . "$SUBLEVEL" "$ANDROID_VER" "$KERNEL_VER" "$KERNEL_PATCHES" || true

    - name: Apply GKID feature groups
      if: ${{ !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      env:
        GKID_NTSYNC: ${{ inputs.gkid_ntsync }}
        GKID_DROIDSPACES: ${{ inputs.gkid_droidspaces }}
        GKID_NETHUNTER: ${{ inputs.gkid_nethunter }}
        GKID_BBRV3: ${{ inputs.gkid_bbrv3 }}
        GKID_NET: ${{ inputs.gkid_net }}
        GKID_NET_DEFAULTS: ${{ inputs.gkid_net_defaults }}
      run: bash "$GITHUB_WORKSPACE/scripts/gkid-extras.sh" . "$GITHUB_WORKSPACE/$VERSION_DIR/gkid" "$GKID_FRAGMENT" "$GKID_REPORT"

    - name: Fail on patch rejects
      run: |
        REJ=$(find "$KERNEL_ROOT/common" "$KERNEL_ROOT/$KSU_DIR" \( -name '*.rej' -o -name '*.orig' \) 2>/dev/null | head -20)
        if [ -n "$REJ" ]; then echo "::error::patch rejects found:"; echo "$REJ"; exit 1; fi
        echo "no patch rejects"

    - name: Setup Baseband Guard
      if: ${{ (inputs.add_bbg) && !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: bash "$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/setup-bbg.sh" . "$DEFCONFIG" "$DEFCONFIG_FRAGMENT"

    - name: Configure kernel
      if: ${{ !inputs.clean_baseline }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        FRAGMENT="$GITHUB_WORKSPACE/$VERSION_DIR/defconfig.fragment"
        HELPERS="$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers"
        # no build/build.sh on 6.12 -> Kleaf; ZRAM stays a module like stock, so no --zram
        bash "$HELPERS/assemble-defconfig.sh" "$FRAGMENT" "$DEFCONFIG_FRAGMENT" "$DEFCONFIG" --susfs --overlayfs --kleaf

        # GKID groups that applied cleanly (+ config-only groups)
        if [ -s "$GKID_FRAGMENT" ]; then cat "$GKID_FRAGMENT" >> "$DEFCONFIG_FRAGMENT"; fi

        if [ "${{ inputs.susfs_profile }}" = "core" ]; then
          for c in KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                   KSU_SUSFS_OPEN_REDIRECT; do
            sed -i "/^CONFIG_${c}=/d;/^# CONFIG_${c} is not set/d" "$DEFCONFIG_FRAGMENT"
            echo "# CONFIG_${c} is not set" >> "$DEFCONFIG_FRAGMENT"
          done
          echo "SUSFS profile: core"
        fi
        # NoMount config (built-in; only if the driver was added)
        if [ "${{ inputs.add_nomount }}" = "true" ] && [ -f common/fs/nomount/Kconfig ]; then
          sed -i '/^CONFIG_NOMOUNT=/d;/^# CONFIG_NOMOUNT is not set/d' "$DEFCONFIG_FRAGMENT"
          echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_FRAGMENT"
        fi

        # drop CONFIG_KSU_* symbols that don't exist in this tree
        while IFS='=' read -r cfg _; do
          symbol="${cfg#CONFIG_}"
          grep -Rqx "config ${symbol}" common/ ${KSU_DIR:+$KSU_DIR/} --include='Kconfig*' 2>/dev/null && continue
          sed -i "/^${cfg}=/d" "$DEFCONFIG_FRAGMENT" "$DEFCONFIG"
        done < <(grep '^CONFIG_KSU_' "$DEFCONFIG_FRAGMENT" 2>/dev/null || true)
        if ! grep -q '^CONFIG_KSU_SUSFS=' "$DEFCONFIG_FRAGMENT" 2>/dev/null; then
          sed -i '/^CONFIG_KSU_SUSFS_/d' "$DEFCONFIG_FRAGMENT" "$DEFCONFIG"
        fi

        # always keep module vermagic flags identical to stock: SMP preempt mod_unload modversions
        sed -i '/^CONFIG_MODVERSIONS=/d;/^CONFIG_MODULE_UNLOAD=/d;/^CONFIG_PREEMPT=/d' "$DEFCONFIG_FRAGMENT"

        # last-wins per CONFIG_ key (GKID fragments are appended after the base fragment)
        tac "$DEFCONFIG_FRAGMENT" | awk -F= '/^CONFIG_/{if(seen[$1]++)next} {print}' | tac > "$DEFCONFIG_FRAGMENT.tmp" && mv "$DEFCONFIG_FRAGMENT.tmp" "$DEFCONFIG_FRAGMENT"

        bash "$HELPERS/bypass-abi-check.sh" . "$ANDROID_VER" "$KERNEL_VER"

        echo "----- final fragment -----"
        cat "$DEFCONFIG_FRAGMENT"

    - name: Module check bypass (CRC) + protected exports cleanup
      if: ${{ inputs.infra_tweaks }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        TARGET_FILE="$KERNEL_ROOT/common/kernel/module/version.c"
        sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"
        rm -f common/android/abi_gki_protected_exports_* || true
        sed -i 's/protected_modules = \[.*\]/protected_modules = []/' common/modules.bzl || true

    - name: Clean build flags
      if: ${{ inputs.infra_tweaks }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: bash "$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/clean-build-flags.sh" . "$KERNEL_VER" "OP15R-Core-${{ inputs.release_version }}"  # uname e.g. 6.12.69-android16-6-4k-OP15R-Core-v1.0.0

    - name: Build kernel (Kleaf/Bazel)
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -o pipefail   # a failed bazel build must not be masked by the pipe into tee
        BUILD_RC=0
        # prebuilt clang sysroot lacks glibc 2.39 C23 symbols -> link host tools against system libc
        if [ -f common/tools/bpf/resolve_btfids/Makefile ]; then
          echo 'override KBUILD_HOSTLDFLAGS += --sysroot=/' >> common/tools/bpf/resolve_btfids/Makefile
          echo 'override LDFLAGS += --sysroot=/' >> common/tools/bpf/resolve_btfids/Makefile
        fi
        FRAG_ARG=""
        [ -f "$DEFCONFIG_FRAGMENT" ] && FRAG_ARG="--defconfig_fragment=//common:arch/arm64/configs/sukisu_gki.fragment"
        echo "fragment arg: ${FRAG_ARG:-<none, stock config>}"
        tools/bazel build --config=fast --lto=none $FRAG_ARG \
          //common:kernel_aarch64_dist 2>&1 | tee "$GITHUB_WORKSPACE/bazel-build.log" || BUILD_RC=${PIPESTATUS[0]}
        if [ "$BUILD_RC" -ne 0 ]; then
          if [ -f bazel-bin/common/kernel_aarch64/Image ]; then
            echo "::warning::Build exited $BUILD_RC but Image exists"
          else
            exit "$BUILD_RC"
          fi
        fi

    - name: Verify the built kernel
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        IMG=bazel-bin/common/kernel_aarch64/Image
        [ -f "$IMG" ] || { echo "::error::Image not found"; find . -name Image -type f | head; exit 1; }
        ls -l "$IMG"
        sha256sum "$IMG"
        echo "--- version string:"
        strings -n 20 "$IMG" | grep -m1 'Linux version' || true
        echo "--- key features present in the binary:"
        for s in susfs nomount kernelsu baseband_guard ntsync; do
          printf '%-16s %s\n' "$s" "$(strings "$IMG" | grep -ci "$s")"
        done
        echo "--- vermagic flags in binary:"
        strings "$IMG" | grep -m2 'SMP preempt' || true

    - name: Package AnyKernel3
      run: |
        cp "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image" "$ANYKERNEL3/Image"
        sed -i "s|^kernel.string=.*|kernel.string=OnePlus 15R ${KERNEL_LABEL:-${KERNEL_VER}.${SUBLEVEL} - ${ARTIFACT_BASE#OP15R-}}|" "$ANYKERNEL3/anykernel.sh"
        mkdir -p out
        cp "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image" out/Image
        (cd "$ANYKERNEL3" && zip -r9 -q "$GITHUB_WORKSPACE/out/${ARTIFACT_BASE}-AnyKernel3.zip" .)
        cp "$GKID_REPORT" out/gkid-report.txt 2>/dev/null || true
        # ABI evidence: export CRCs of every kernel symbol (used to check vendor-module compatibility)
        for f in Module.symvers System.map; do
          src=$(find "$KERNEL_ROOT/bazel-bin/common" "$KERNEL_ROOT/out" -maxdepth 4 -name "$f" -type f 2>/dev/null | head -1)
          [ -n "$src" ] && cp "$src" "out/$f" && echo "collected $f from $src" || echo "::warning::$f not found"
        done
        src=$(find "$KERNEL_ROOT/bazel-bin/common" "$KERNEL_ROOT/out" -maxdepth 4 -name ".config" -type f 2>/dev/null | head -1)
        [ -n "$src" ] && cp "$src" out/final.config || echo "::warning::.config not found"
        cp "$DEFCONFIG_FRAGMENT" out/final-config.fragment 2>/dev/null || true
        (cd out && sha256sum * > SHA256SUMS.txt)
        ls -l out

    - name: Collect patch rejects
      if: always()
      run: |
        mkdir -p patch-rejects
        find "$KERNEL_ROOT" -type f -name '*.rej' -print0 2>/dev/null | while IFS= read -r -d '' f; do
          rel="${f#"$KERNEL_ROOT"/}"; mkdir -p "patch-rejects/$(dirname "$rel")"; cp "$f" "patch-rejects/$rel"
        done
        [ -f "$GKID_REPORT" ] && cp "$GKID_REPORT" patch-rejects/ || true
        [ -f "$GITHUB_WORKSPACE/bazel-build.log" ] && tail -n 400 "$GITHUB_WORKSPACE/bazel-build.log" > patch-rejects/bazel-tail.log || true

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_BASE }}
        path: out/*
        if-no-files-found: error
        compression-level: 6

    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: diagnostics
        path: patch-rejects/
        if-no-files-found: ignore

    - name: Job summary
      if: always()
      run: |
        {
          echo "## OP15R kernel 6.12.${SUBLEVEL:-?}"
          echo ""
          echo '```'
          cat "$GKID_REPORT" 2>/dev/null || echo "(no gkid report)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
